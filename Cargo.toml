[workspace]
resolver = "2"
members = [
    "crates/oxibrowser",
    "crates/oxibrowser-cdp",
    "crates/oxibrowser-core",
    "crates/oxibrowser-webapi",
]

[workspace.package]
version = "0.11.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["Oxios Team"]
repository = "https://github.com/a7garden/oxibrowser"
homepage = "https://github.com/a7garden/oxibrowser"
readme = "README.md"
keywords = ["browser", "headless", "cdp", "automation", "dom"]
categories = ["web-programming", "parser-implementations"]
rust-version = "1.82"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio-tungstenite = "0.26"
image = "0.25"
url = "2"
html5ever = "0.29"
markup5ever = "0.14"
string_cache = "0.8"
log = "0.4"
encoding_rs = "0.8"
bytes = "1"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
sha1 = "0.10"
base64 = "0.22"
boa_engine = "0.20"
boa_gc = "0.20"
getrandom = "0.3"

[workspace.metadata.release]
version = "0.11.0"