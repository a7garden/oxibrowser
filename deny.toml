[advisories]
# cargo-deny 0.20+: vulnerability/unmaintained/yanked/unsound are all
# denied by default; only `ignore` remains.
#
# RUSTSEC-2024-0436 (paste): unmaintained proc-macro dep, transitively
# pulled in by boa_engine via boa_string. Upstream boa must switch off
# `paste` before this can be removed; no actionable fix on our side.
ignore = ["RUSTSEC-2024-0436", "RUSTSEC-2026-0192", "RUSTSEC-2026-0206"]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-DFS-2016", "Unicode-3.0", "Zlib", "BSL-1.0", "OpenSSL", "NCSA", "CDLA-Permissive-2.0", "MPL-2.0", "CC0-1.0"]

confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]